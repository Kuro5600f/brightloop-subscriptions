services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  # Fake SMTP inbox: every email Odoo sends shows up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  odoo:
    image: odoo:18.0
    depends_on:
      - db
      - mailpit
    # serve only the demo DB (tests/perf DBs live alongside it); `docker compose run` overrides this
    # one command for judges: creates/updates the demo DB with seed data, then serves it
    command: -d brightloop -i brightloop_subscription --without-demo=all --db-filter=^brightloop$$
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
